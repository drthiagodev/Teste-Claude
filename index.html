<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carteira</title>
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Carteira">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    /* Variáveis que o painel usa no Claude, recriadas aqui (claro e escuro). */
    :root {
      --color-fg: #1f1e1c; --color-fg-muted: #6b6862; --color-bg: #f7f6f3; --color-panel: #ffffff;
      --color-border-line: #e4e1da; --color-ok: #2f7d4f; --color-warn: #a86a12; --color-bad: #b2412f;
      --font-anthropic-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-anthropic-serif: Georgia, "Times New Roman", serif;
      --cds-font-size-caption: 12.5px; --cds-font-size-body: 15px; --cds-font-size-heading: 17px; --cds-font-size-title: 28px;
      --cds-font-weight-medium: 600;
      --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 18px; --cds-gap-xl: 28px;
      --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 14px; --cds-pad-xl: 24px;
      --cds-radius: 10px;
      --cds-chart-muted: #c9c5bc; --cds-chart-grid: #ece9e3; --cds-chart-axis: #c9c5bc; --cds-chart-reference: #8f8b83;
      --cds-chart-status-critical: #b2412f;
      --cds-text-secondary: #6b6862; --cds-surface-popover: #ffffff; --cds-border: #e4e1da;
      --cds-shadow-popover: 0 4px 16px rgba(0,0,0,.12);
      --cds-dur-slow: .3s; --cds-ease-out: cubic-bezier(.2,.8,.2,1);
      --serie-1: #3b6fd8; --serie-2: #d9822b; --serie-3: #2f9e7a; --serie-4: #b5487a;
      --serie-5: #7c5cd6; --serie-6: #b39b2a; --serie-7: #4aa3c7; --serie-8: #8a8a8a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-fg: #ecebe8; --color-fg-muted: #a29f98; --color-bg: #1c1b19; --color-panel: #262522;
        --color-border-line: #3a3834; --color-ok: #6cc28f; --color-warn: #e0a54a; --color-bad: #ec7b66;
        --cds-chart-muted: #55524c; --cds-chart-grid: #33312d; --cds-chart-axis: #55524c; --cds-chart-reference: #8f8b83;
        --cds-chart-status-critical: #ec7b66;
        --cds-text-secondary: #a29f98; --cds-surface-popover: #2f2e2a; --cds-border: #3a3834;
        --cds-shadow-popover: 0 4px 16px rgba(0,0,0,.5);
        --serie-1: #7aa2f0; --serie-2: #f0a35a; --serie-3: #5cc4a0; --serie-4: #e07aa8;
        --serie-5: #a58cf0; --serie-6: #d6be4f; --serie-7: #7cc5e3; --serie-8: #a8a8a8;
      }
    }
    html, body { margin: 0; }
    body {
      background: var(--color-bg); color: var(--color-fg);
      font: var(--cds-font-size-body)/1.45 var(--font-anthropic-sans);
      -webkit-text-size-adjust: 100%;
    }
    .barra-app {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: flex-end; gap: 8px;
      padding: calc(6px + env(safe-area-inset-top)) 16px 6px;
      background: var(--color-bg); border-bottom: 1px solid var(--color-border-line);
    }
    .barra-app .msg { flex: 1; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .barra-app .msg.erro { color: var(--color-bad); }
    .barra-app button {
      font: inherit; font-size: var(--cds-font-size-caption); color: var(--color-fg);
      background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 999px; padding: 5px 12px;
    }
    #dash-root [hidden] { display: none !important; }
    #dash-root { padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 1100px; margin: 0 auto; }
    /* Ajustes de toque para telas pequenas, sem mexer no painel. */
    @media (max-width: 600px) {
      #dash-root .cp .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
      #dash-root .cp .tabs::-webkit-scrollbar { display: none; }
      #dash-root .cp .tabs button { white-space: nowrap; padding: 10px 12px; }
      #dash-root .cp button.t { padding: 6px 12px; }
      #dash-root .cp select, #dash-root .cp input[type=search] { font-size: 16px; }
    }
    dialog {
      border: 1px solid var(--color-border-line); border-radius: 14px; padding: 18px;
      background: var(--color-panel); color: var(--color-fg); width: min(92vw, 420px);
    }
    dialog::backdrop { background: rgba(0,0,0,.4); }
    dialog h2 { margin: 0 0 12px; font-size: 18px; }
    dialog p { font-size: 14px; color: var(--color-fg-muted); margin: 6px 0 12px; text-align: justify; }
    dialog label { display: block; font-size: 13px; color: var(--color-fg-muted); margin-bottom: 12px; }
    dialog input[type=text] {
      display: block; width: 100%; box-sizing: border-box; margin-top: 4px; font: inherit; font-size: 16px;
      padding: 8px 10px; border: 1px solid var(--color-border-line); border-radius: 8px; background: var(--color-bg); color: var(--color-fg);
    }
    dialog .botoes { display: flex; flex-direction: column; gap: 8px; }
    dialog .botoes button, dialog .botoes label.btn {
      font: inherit; font-size: 15px; text-align: center; padding: 10px; border-radius: 10px; margin: 0;
      border: 1px solid var(--color-border-line); background: var(--color-bg); color: var(--color-fg); cursor: pointer;
    }
    dialog .botoes .principal { background: var(--serie-1); border-color: var(--serie-1); color: #fff; }
    dialog .info { font-size: 12.5px; color: var(--color-fg-muted); margin-top: 12px; }
  </style>
</head>
<body>
  <div class="barra-app">
    <span id="msg" class="msg" role="status"></span>
    <button id="btn-atualizar" type="button">Atualizar</button>
    <button id="btn-dados" type="button">Dados</button>
  </div>

  <div id="dash-root"></div>

  <dialog id="dlg-dados">
    <h2>Dados do app</h2>
    <p>Lançamentos, proventos e renda fixa ficam só neste aparelho, no pacote que você importa aqui. As cotações vêm da planilha a cada atualização.</p>
    <label>Planilha de cotações (link ou ID)
      <input id="inp-sheet" type="text" autocomplete="off" placeholder="https://docs.google.com/spreadsheets/d/…">
    </label>
    <div class="botoes">
      <label class="btn principal">Importar pacote de dados (.json)
        <input id="inp-pacote" type="file" accept="application/json,.json" hidden>
      </label>
      <button id="btn-salvar" type="button">Salvar planilha e atualizar</button>
      <button id="btn-fechar" type="button">Fechar</button>
    </div>
    <div id="info-dados" class="info"></div>
  </dialog>

  <script src="vendor/d3.min.js"></script>
  <script src="dash-shim.js"></script>
  <script>
  (async () => {
    const app = window.CarteiraApp;
    const msg = document.getElementById('msg');
    const dlg = document.getElementById('dlg-dados');
    const status = (t, erro) => { msg.textContent = t || ''; msg.classList.toggle('erro', !!erro); };

    const extraiId = (s) => {
      const t = String(s || '').trim();
      const m = t.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]{20,})/);
      return m ? m[1] : (/^[a-zA-Z0-9_-]{20,}$/.test(t) ? t : '');
    };

    async function infoDados() {
      const p = await app.ler('pacote');
      document.getElementById('info-dados').textContent = p
        ? `Pacote importado: gerado em ${p.gerado.split('-').reverse().join('/')}.`
        : 'Nenhum pacote importado ainda.';
      document.getElementById('inp-sheet').value = (await app.ler('sheetId')) || (p && p.sheetId) || '';
    }

    async function atualizar() {
      status('Atualizando cotações…');
      const { falhas } = await app.atualizar();
      if (falhas.length) status('Cotações não atualizadas (' + falhas[0] + '). Mostrando as últimas salvas.', true);
      else status('Cotações de ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
    }

    document.getElementById('btn-atualizar').onclick = atualizar;
    document.getElementById('btn-dados').onclick = async () => { await infoDados(); dlg.showModal(); };
    document.getElementById('btn-fechar').onclick = () => dlg.close();
    document.getElementById('btn-salvar').onclick = async () => {
      const id = extraiId(document.getElementById('inp-sheet').value);
      if (!id) { document.getElementById('info-dados').textContent = 'Link ou ID da planilha inválido.'; return; }
      await app.gravar('sheetId', id);
      dlg.close();
      atualizar();
    };
    document.getElementById('inp-pacote').onchange = async (e) => {
      const arq = e.target.files[0];
      e.target.value = '';
      if (!arq) return;
      try {
        const r = await app.importar(await arq.text());
        await infoDados();
        if (r.faltam.length) document.getElementById('info-dados').textContent += ' Faltam: ' + r.faltam.join(', ') + '.';
        atualizar();
      } catch (err) {
        document.getElementById('info-dados').textContent = 'Não consegui importar: ' + err.message;
      }
    };

    try {
      const html = await (await fetch('painel.html')).text();
      const pacote = await app.iniciar(html);
      if (!pacote) { status('Toque em “Dados” e importe seu pacote.', true); await infoDados(); dlg.showModal(); }
      else atualizar();
    } catch (err) {
      status('Falha ao abrir o painel: ' + err.message, true);
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  })();
  </script>
</body>
</html>
